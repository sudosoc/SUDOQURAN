name: sudoquran
description: SUDOQURAN — offline Quran & Ruqyah player for Android car head units.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  just_audio: ">=0.9.40 <0.10.0"
  just_audio_background: 0.0.1-beta.13
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  http: ^1.2.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#06141B"
  adaptive_icon_foreground: "assets/icon_fg.png"
  min_sdk_android: 21
