name: Sources

on:
  push:
    branches: [main]
    paths: ['tool/build_sources.py', '.github/workflows/sources.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'   # weekly refresh

permissions:
  contents: write

concurrency:
  group: sources
  cancel-in-progress: true

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hunt for MP3 sources
        run: python3 tool/build_sources.py
      - name: Commit sources.json + report
        run: |
          git config user.name "sudoquran-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/sources.json tool/report.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh audio sources"
          git pull --rebase origin main
          git push origin HEAD:main
