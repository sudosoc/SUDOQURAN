name: Smoke test (emulator)

on:
  push:
    branches: [main]
    paths: ['lib/**', 'pubspec.yaml', 'android_overrides/**', 'tool/smoke.sh', 'tool/emulator.sh', '.github/workflows/smoke-test.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/setup_android.sh
      - name: Build x64 release APK (same config as the car build)
        run: flutter build apk --release --target-platform android-x64
      - name: Free disk space
        run: |
          mkdir -p /tmp/apk && cp build/app/outputs/flutter-apk/app-release.apk /tmp/apk/
          rm -rf build android/.gradle ~/.gradle/caches
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk /usr/local/.ghcup /usr/share/swift || true
          mkdir -p build/app/outputs/flutter-apk && cp /tmp/apk/app-release.apk build/app/outputs/flutter-apk/
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator + launch app
        run: bash tool/emulator.sh || true
      - name: Push smoke logs
        if: always()
        run: |
          mkdir -p /tmp/smoke && cp -r smoke/. /tmp/smoke/ 2>/dev/null || true
          git config user.name "sudoquran-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan smoke-tmp
          git rm -rf --cached . >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/smoke/. . 2>/dev/null || echo none > none.txt
          rm -f logcat_full.txt.gz; gzip -f logcat_full.txt 2>/dev/null || true
          echo "${{ github.sha }} $(date -u)" > RUN.txt
          git add -A && git commit -qm "smoke logs" && git push -f origin HEAD:smoke-logs
