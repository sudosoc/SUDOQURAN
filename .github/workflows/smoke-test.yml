name: Smoke test (emulator)

on:
  push:
    branches: [main]
    paths: ['lib/**', 'pubspec.yaml', 'android_overrides/**', 'tool/smoke.sh', 'tool/emulator.sh', '.github/workflows/smoke-test.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash tool/setup_android.sh
      - name: Build x64 release APK (same config as the car build)
        run: flutter build apk --release --target-platform android-x64
      - name: Free disk space
        run: |
          mkdir -p /tmp/apk && cp build/app/outputs/flutter-apk/app-release.apk /tmp/apk/
          rm -rf build android/.gradle ~/.gradle/caches
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk /usr/local/.ghcup /usr/share/swift || true
          mkdir -p build/app/outputs/flutter-apk && cp /tmp/apk/app-release.apk build/app/outputs/flutter-apk/
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator + launch app
        run: bash tool/emulator.sh || true
      - name: Push smoke logs
        if: always()
        run: |
          mkdir -p /tmp/smoke
          cp smoke/logcat.txt smoke/pid.txt smoke/install.txt smoke/screen1.png smoke/screen2.png /tmp/smoke/ 2>/dev/null || true
          tail -c 20000 smoke/emulator_setup.txt > /tmp/smoke/emulator_setup_tail.txt 2>/dev/null || true
          tail -c 8000 smoke/emulator_log.txt > /tmp/smoke/emulator_log_tail.txt 2>/dev/null || true
          grep -E "AndroidRuntime|FATAL|F DEBUG|F libc|backtrace|#[0-9]+ pc|Abort|SIGSEGV|SIGABRT|sudoquran|flutter" smoke/logcat_full.txt | head -600 > /tmp/smoke/crash.txt 2>/dev/null || true
          ls -la /tmp/smoke
          git config user.name "sudoquran-bot"
          git config user.email "actions@users.noreply.github.com"
          cd /tmp/smoke
          git init -q -b smoke-logs
          echo "${{ github.sha }} $(date -u)" > RUN.txt
          git add -A && git -c user.name=bot -c user.email=bot@x commit -qm "smoke logs"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" smoke-logs:smoke-logs
